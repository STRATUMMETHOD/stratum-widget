you'll be able to write a line of dialogue and explain exactly why your character spoke that way. You'll spot a hollow scene - and know how to repair it. You'll write characters whose voices are distinct, whose silences carry weight, whose contradictions feel like the contradictions of real people. And you'll have a method you can apply for the rest of your writing life. If something in you just sat up straighter - good. And every lesson in this course ends the same way - with a conversation. When the video's over, you'll sit down with your Excavation Coach, built on my method and trained to ask the way I'd ask. It won't write a line of your story. It won't hand you an answer. It'll ask the one question that gets you to the answer you already have but haven't said out loud yet. That conversation is where the real work happens. Let's take this journey together.", "reflectionFramework": {"areas": [{"title": "THE SCENE THAT WHISPERED \"FLAT\"", "instructions": "The lecture opens with that moment: finishing a scene, reading it back, and something inside whispering \"flat\" - the dialogue works, the plot moves, but the character is a puppet reciting lines rather than a person living them. Ask if there's a scene from their own past writing that ever did that to them. Get them to actually describe what happened - not just \"yeah, that happens to me,\" but a specific scene, a specific character, what it felt like to read it back."}, {"title": "WHAT THEY FELT HEARING THE PROMISE", "instructions": "The lecture promises a complete method that can change how they write characters for the rest of their life. Ask what they felt when they heard that - specifically feeling, not verdict. You are not asking whether they believe it works. You are asking what happened in them when they heard a claim that big. Hope, skepticism, both at once, something else entirely - let them find their own words for it."}, {"title": "WHAT ACTUALLY BROUGHT THEM HERE", "instructions": "Something brought ifiek personage, waarbij je het teruglas en dat voelde."}, "Chinese": {"fresh": "嘿，那节课刚结束，我还在这儿陪着你。\n\n在我们开始之前，我想知道我在和谁说话。你叫什么名字？", "known": "嘿 {name}，那节课刚结束，我还在这儿陪着你。\n\n那个开场的场景——就是内心某处轻声说\"平淡\"的那一刻。你有过这种经历吗？一个具体的场景，一个具体的角色，你重读时感受到了这一点。"}, "Japanese": {"fresh": "やあ、ちょうどレッスンが終わったところだね。まだここに一緒にいるよ。\n\n本題に入る前に、誰と話しているのか知りたいな。お名前は？", "known": "やあ {name}、ちょうどレッスンが終わったところだね。まだここに一緒にいるよ。\n\nあの冒頭のシーン——心の中で何かが「平坦だ」とささやいた瞬間。そんな経験はある？具体的なシーン、具体的なキャラクターで、読み返してそう感じた瞬間。"}, "Korean": {"fresh": "안녕하세요, 방금 강의가 끝났으니 아직 여기서 함께 있어요.\n\n본격적으로 시작하기 전에, 제가 누구와 이야기하고 있는지 알고 싶어요. 이름이 어떻게 되세요?", "known": "안녕하세요 {name}, 방금 강의가 끝났으니 아직 여기서 함께 있어요.\n\n그 오프닝 장면 있잖아요, 마음속 무언가가 \"밋밋하다\"고 속삭이는 순간이요. 그런 경험 있으셨나요? 구체적인 장면, 구체적인 캐릭터로, 다시 읽었을 때 그렇게 느꼈던 순간이요."}, "Arabic": {"fresh": "مرحبًا، انتهى الدرس للتو، وما زلت هنا معك.\n\nقبل أن نبدأ، أود أن أعرف مع من أتحدث. ما اسمك؟", "known": "مرحبًا {name}، انتهى الدرس للتو، وما زلت هنا معك.\n\nتلك المشهد الافتتاحي، ذلك الذي يهمس فيه شيء بداخلك بكلمة \"باهت\". هل حدث لك ذلك من قبل؟ مشهد محدد، شخصية محددة، حيث أعدت قراءته وشعرت بذلك."}, "Hindi": {"fresh": "अरे, वह लेक्चर अभी खत्म हुआ है, तो मैं अभी भी यहाँ आपके साथ हूँ।\n\nआगे बढ़ने से पहले, मैं जानना चाहूँगा कि मैं किससे बात कर रहा हूँ। आपका नाम क्या है?", "known": "अरे {name}, वह लेक्चर अभी खत्म हुआ है, तो मैं अभी भी यहाँ आपके साथ हूँ।\n\nवह शुरुआती दृश्य - जहाँ आपके अंदर कुछ \"फीका\" फुसफुसाता है। क्या कभी आपके साथ ऐसा हुआ है? कोई खास दृश्य, कोई खास किरदार, जहाँ आपने उसे दोबारा पढ़ा और यही महसूस किया।"}, "Russian": {"fresh": "Привет, урок только что закончился, так что я всё ещё здесь, с тобой.\n\nПрежде чем мы начнём, я хотел бы узнать, с кем говорю. Как тебя зовут?", "known": "Привет, {name}, урок только что закончился, так что я всё ещё здесь, с тобой.\n\nТа вступительная сцена - та, где что-то внутри тебя шепчет \"плоско\". Такое когда-нибудь случалось с тобой? Конкретная сцена, конкретный персонаж, когда ты перечитал и почувствовал именно это."}}}};

var keyInput = document.getElementById('adminKey');
var btn = document.getElementById('uploadBtn');
var status = document.getElementById('status');

var savedKey = localStorage.getItem('stratum_admin_key_temp');
if (savedKey) keyInput.value = savedKey;

document.getElementById('preview').textContent = JSON.stringify(CONFIG, null, 2);

btn.addEventListener('click', function () {
  var key = keyInput.value.trim();
  if (!key) {
    status.textContent = 'Enter your admin key first.';
    status.className = 'err';
    return;
  }
  localStorage.setItem('stratum_admin_key_temp', key);

  btn.disabled = true;
  status.textContent = 'Uploading...';
  status.className = '';

  fetch(PROXY_URL + '/lesson-config', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Stratum-Admin-Key': key
    },
    body: JSON.stringify({ lessonId: LESSON_ID, config: CONFIG })
  })
    .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
    .then(function (result) {
      btn.disabled = false;
      if (result.status === 200 && result.data && result.data.ok) {
        status.textContent = 'Success. Lesson ' + result.data.lessonId + ' config saved to the database.';
        status.className = 'ok';
      } else if (result.status === 401) {
        status.textContent = 'Unauthorized - the admin key was rejected. Double check it matches STRATUM_ADMIN_KEY on the Worker.';
        status.className = 'err';
      } else {
        status.textContent = 'Error: ' + JSON.stringify(result.data);
        status.className = 'err';
      }
    })
    .catch(function (e) {
      btn.disabled = false;
      status.textContent = 'Network error: ' + e.message;
      status.className = 'err';
    });
});
</script>
