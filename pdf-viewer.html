<!DOCTYPE html>
<!--
  STRATUM PDF VIEWER
  ------------------------------------------------------------
  Hosted on GitHub Pages alongside stratum-lesson-engine.js/css. Loaded
  inside an iframe from buildResource() in the engine JS, as:
    pdf-viewer.html?file=<url-encoded PDF url>

  Why this exists (Sept 2026): the engine used to point the resource
  iframe straight at the PDF file, using #toolbar=0&navpanes=0&view=FitH
  hash params to hide the browser's own PDF-viewer chrome and stretch the
  page to fill the iframe's width. That worked on desktop Chrome/Edge, but
  iOS Safari's built-in PDF renderer ignores the width-fit param, so on
  phones the page rendered at native width and overflowed sideways inside
  the (already full-width) iframe.

  This page sidesteps browser-specific PDF-viewer behavior entirely: it
  loads the PDF with PDF.js and renders every page onto a plain <canvas>
  sized to this page's own width, which we calculate and control
  ourselves. That makes width-fit behave identically on desktop and
  mobile, since neither platform's native PDF viewer is involved at all.
  Cache-bust the pdf.js/pdf.worker.js CDN version pin below only if a
  reason to (e.g. a security fix); no need to bump it just because the
  engine files changed.

  Sept 2026 fix #1 (right-edge/margin cutoff): targetWidth() used to
  measure #pdf-pages.clientWidth - a flex child inside a scrolling body.
  Early in a load, before enough canvases exist to make the page taller
  than the iframe, no vertical scrollbar is present and clientWidth reads
  wide; once enough pages have rendered to trigger overflow-y's scrollbar,
  the same element's clientWidth reads narrower. Pages rendered in that
  narrow window could end up sized against a stale wide measurement long
  enough to be visible before a resize observer caught up, and with
  overflow-x:hidden on <body>, anything sized wider than the true visible
  width was silently clipped on the right rather than wrapping or
  scrolling - reading as a "right margin" problem. Switched the
  measurement to document.documentElement.clientWidth, the standard,
  scrollbar-aware way to read the true visible viewport width regardless
  of the flex/overflow structure around it - it reflects the presence or
  absence of the scrollbar directly, without depending on a specific
  child element's own box having already settled.

  Sept 2026 fix #2 (Spanish PDF fails to load here but opens fine via the
  direct link): PDF.js defaults to probing the server with byte-range
  requests so it can start rendering before the whole file has downloaded.
  A plain browser navigation (the fallback link) never does this - it's
  always one plain GET - so a document that loads fine as a direct link
  but rejects here is consistent with the server responding inconsistently
  to PDF.js's range probe for that particular file (stale/mismatched cache
  headers on some CDN edges are a known cause). Passing disableRange and
  disableStream makes PDF.js fetch the file the same simple way a direct
  link does - one full GET, no range requests - trading a little
  progressive-load speed on very large files for reliability on files the
  CDN doesn't range-serve consistently; course handout PDFs are small
  enough that this cost is negligible. The catch handler also now logs the
  real rejection reason to the console instead of discarding it, so a
  future failure like this is diagnosable from devtools rather than only
  showing the generic fallback message.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resource</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #pdf-pages {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 10px 0 24px;
    box-sizing: border-box;
  }
  #pdf-pages canvas {
    display: block;
    max-width: 100%;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .14);
  }
  #pdf-status {
    font-family: Arial, sans-serif;
    font-size: 13px;
    line-height: 1.6;
    color: #6f6353;
    text-align: center;
    padding: 48px 20px;
  }
  #pdf-status a {
    color: #8a6630;
    font-weight: 600;
  }
</style>
</head>
<body>
<div id="pdf-status">Loading document&hellip;</div>
<div id="pdf-pages"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('pdf-status');
  var pagesEl = document.getElementById('pdf-pages');

  var params = new URLSearchParams(window.location.search);
  var fileUrl = params.get('file');

  if (!fileUrl) {
    statusEl.textContent = 'No document specified.';
    return;
  }
  if (!window.pdfjsLib) {
    showFallback('Could not load the document viewer.');
    return;
  }

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  function showFallback(message) {
    statusEl.style.display = 'block';
    statusEl.innerHTML = message +
      ' <a href="' + fileUrl + '" target="_blank" rel="noopener">Open the PDF directly</a>.';
  }

  function debounce(fn, delay) {
    var timer = null;
    return function () {
      clearTimeout(timer);
      timer = setTimeout(fn, delay);
    };
  }

  var pdfDoc = null;
  var pageEntries = []; // { canvas, pageNum }
  var renderTokens = {}; // pageNum -> token, so a stale in-flight render from
                          // before a resize can't overwrite a newer one

  // A little breathing room either side so the page doesn't touch the
  // iframe's own edge; 280 is a sane floor for very narrow phone widths.
  // Sept 2026 fix: measured off document.documentElement.clientWidth
  // (the standard scrollbar-aware viewport width) rather than
  // pagesEl.clientWidth - see the file-header note above for why reading
  // a flex child's own clientWidth here could momentarily disagree with
  // the true visible width while the page's vertical scrollbar was
  // appearing/disappearing mid-load, and how that disagreement showed up
  // as content clipped on the right (overflow-x is intentionally hidden
  // on <body>, so anything sized wider than the true viewport is clipped
  // rather than wrapped or horizontally scrollable).
  function targetWidth() {
    var viewportWidth = document.documentElement.clientWidth ||
      document.body.clientWidth || window.innerWidth || pagesEl.clientWidth;
    return Math.max(280, viewportWidth - 16);
  }

  function renderPage(pageNum, canvas) {
    var token = (renderTokens[pageNum] || 0) + 1;
    renderTokens[pageNum] = token;
    pdfDoc.getPage(pageNum).then(function (page) {
      if (renderTokens[pageNum] !== token) return; // superseded by a newer resize
      var unscaled = page.getViewport({ scale: 1 });
      var width = targetWidth();
      var cssScale = width / unscaled.width;
      var dpr = window.devicePixelRatio || 1;
      var viewport = page.getViewport({ scale: cssScale * dpr });
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.style.width = width + 'px';
      canvas.style.height = (viewport.height / dpr) + 'px';
      var ctx = canvas.getContext('2d');
      page.render({ canvasContext: ctx, viewport: viewport });
    }).catch(function () {
      // One bad page shouldn't take down the whole document view.
    });
  }

  var lastRenderedWidth = null;

  function renderAllPages() {
    pageEntries.forEach(function (entry) {
      renderPage(entry.pageNum, entry.canvas);
    });
  }

  // Only re-render when the measured width has actually changed. Without
  // this guard, a ResizeObserver watching a flex container whose HEIGHT
  // also changes as each canvas finishes rendering would keep firing on
  // its own re-renders - harmless since it converges immediately, but
  // wasteful, and this makes that explicit instead of relying on it
  // happening to settle.
  function renderIfWidthChanged() {
    var w = targetWidth();
    if (w === lastRenderedWidth) return;
    lastRenderedWidth = w;
    renderAllPages();
  }

  // Sept 2026 fix: this page is loaded inside a resource embed that
  // starts collapsed (a closed <details> accordion on the parent page).
  // The very first render - triggered as soon as the PDF finishes
  // loading - could happen while that accordion is still closed, at
  // which point this (cross-origin) iframe has no real rendered box yet
  // and browsers report a stale/default width (commonly ~300 CSS px)
  // instead of the panel's actual width. A plain `window resize`
  // listener doesn't reliably catch "the parent accordion just opened,
  // and this iframe's effective size changed as a result" - that isn't
  // the same kind of event as the browser window itself being resized.
  // ResizeObserver does catch it: it fires whenever this element's own
  // box size changes, for any reason, including going from a hidden/
  // collapsed ancestor to a visible one - so the canvas gets re-measured
  // and re-rendered at the correct width the moment the panel actually
  // becomes visible, not just on manual window resizes. Falls back to
  // the plain resize listener alone on the rare browser without
  // ResizeObserver support.
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(debounce(renderIfWidthChanged, 150));
    ro.observe(pagesEl);
  } else {
    window.addEventListener('resize', debounce(renderIfWidthChanged, 200));
  }

  // Sept 2026 fix: disableRange/disableStream force PDF.js to fetch the
  // whole file with one plain GET, the same way the "Open the PDF
  // directly" fallback link (a normal browser navigation) already does -
  // see the file-header note above for why a document that opens fine
  // via that link but fails here is consistent with the server handling
  // PDF.js's default byte-range probing inconsistently for that file.
  pdfjsLib.getDocument({
    url: fileUrl,
    disableRange: true,
    disableStream: true
  }).promise.then(function (doc) {
    pdfDoc = doc;
    statusEl.style.display = 'none';
    lastRenderedWidth = targetWidth();
    for (var i = 1; i <= doc.numPages; i++) {
      var canvas = document.createElement('canvas');
      pagesEl.appendChild(canvas);
      pageEntries.push({ canvas: canvas, pageNum: i });
      renderPage(i, canvas);
    }
  }).catch(function (err) {
    // Sept 2026 fix: log the real reason instead of discarding it, so a
    // future load failure is debuggable from the browser console (the
    // fallback message shown to the student stays generic on purpose).
    try { console.error('[Stratum PDF Viewer] Failed to load PDF:', fileUrl, err); } catch (e) {}
    showFallback('This document could not be displayed here.');
  });
})();
</script>
</body>
</html>
