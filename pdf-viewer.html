<!DOCTYPE html>
<!--
  STRATUM PDF VIEWER
  ------------------------------------------------------------
  Hosted on GitHub Pages alongside stratum-lesson-engine.js/css. Loaded
  inside an iframe from buildResource() in the engine JS, as:
    pdf-viewer.html?file=<url-encoded PDF url>

  Why this exists (Sept 2026): the engine used to point the resource
  iframe straight at the PDF file, using #toolbar=0&navpanes=0&view=FitH
  hash params to hide the browser's own PDF-viewer chrome and stretch the
  page to fill the iframe's width. That worked on desktop Chrome/Edge, but
  iOS Safari's built-in PDF renderer ignores the width-fit param, so on
  phones the page rendered at native width and overflowed sideways inside
  the (already full-width) iframe.

  This page sidesteps browser-specific PDF-viewer behavior entirely: it
  loads the PDF with PDF.js and renders every page onto a plain <canvas>
  sized to this page's own width, which we calculate and control
  ourselves. That makes width-fit behave identically on desktop and
  mobile, since neither platform's native PDF viewer is involved at all.
  Cache-bust the pdf.js/pdf.worker.js CDN version pin below only if a
  reason to (e.g. a security fix); no need to bump it just because the
  engine files changed.

  Sept 2026 fix #1 (right-edge/margin cutoff): the previous approach had
  JavaScript measure the container's width in pixels (first via
  #pdf-pages.clientWidth, then via document.documentElement.clientWidth)
  and set that exact pixel value as the canvas's CSS width. Any mismatch
  between that measurement and the container's true rendered width - from
  scrollbar timing, flex/overflow interplay, or anything else - showed up
  as a gap, and with overflow-x:hidden on <body> a too-wide measurement
  was silently clipped rather than visibly wrapping, making the class of
  bug hard to pin down from a screenshot alone. Replaced entirely: each
  canvas is now rendered at a fixed, generous backing-store resolution
  (RENDER_WIDTH_PX below) and displayed via plain CSS `width:100%;
  height:auto` (see #pdf-pages canvas below), the same pattern a
  responsive <img> already uses. The browser's own layout engine now
  determines the exact final pixel width every time, synchronously, with
  no JavaScript measurement or timing involved - so this specific bug
  class (computed width narrower than the real container) is no longer
  possible regardless of scrollbar state, flex quirks, or window size.
  This also means the page no longer needs to re-measure or re-render on
  resize at all: CSS handles that automatically, which is why the old
  targetWidth()/ResizeObserver/resize-listener machinery below has been
  removed rather than adjusted again.

  Sept 2026 fix #2 (Spanish PDF fails to load here but opens fine via the
  direct link): PDF.js defaults to probing the server with byte-range
  requests so it can start rendering before the whole file has downloaded.
  A plain browser navigation (the fallback link) never does this - it's
  always one plain GET - so a document that loads fine as a direct link
  but rejects here is consistent with the server responding inconsistently
  to PDF.js's range probe for that particular file (stale/mismatched cache
  headers on some CDN edges are a known cause). Passing disableRange and
  disableStream makes PDF.js fetch the file the same simple way a direct
  link does - one full GET, no range requests - trading a little
  progressive-load speed on very large files for reliability on files the
  CDN doesn't range-serve consistently; course handout PDFs are small
  enough that this cost is negligible. The catch handler also now logs the
  real rejection reason to the console instead of discarding it, so a
  future failure like this is diagnosable from devtools rather than only
  showing the generic fallback message.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resource</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #pdf-pages {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    gap: 10px;
    padding: 10px 0 24px;
    box-sizing: border-box;
  }
  #pdf-pages canvas {
    display: block;
    width: 100%;
    height: auto;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .14);
  }
  #pdf-status {
    font-family: Arial, sans-serif;
    font-size: 13px;
    line-height: 1.6;
    color: #6f6353;
    text-align: center;
    padding: 48px 20px;
  }
  #pdf-status a {
    color: #8a6630;
    font-weight: 600;
  }
</style>
</head>
<body>
<div id="pdf-status">Loading document&hellip;</div>
<div id="pdf-pages"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('pdf-status');
  var pagesEl = document.getElementById('pdf-pages');

  var params = new URLSearchParams(window.location.search);
  var fileUrl = params.get('file');

  if (!fileUrl) {
    statusEl.textContent = 'No document specified.';
    return;
  }
  if (!window.pdfjsLib) {
    showFallback('Could not load the document viewer.');
    return;
  }

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  function showFallback(message) {
    statusEl.style.display = 'block';
    statusEl.innerHTML = message +
      ' <a href="' + fileUrl + '" target="_blank" rel="noopener">Open the PDF directly</a>.';
  }

  var pdfDoc = null;

  // Fixed backing-store width in device pixels, independent of the
  // container's actual rendered size - see the file-header note above.
  // CSS (`width:100%; height:auto` on #pdf-pages canvas) does all the
  // actual sizing; this only needs to be high enough that the canvas
  // stays sharp at the largest width it will ever actually be displayed
  // at. Sept 2026: the canvas has no max-width cap anymore (removed at
  // Ted's request so the page renders as large as the resource panel
  // allows, matching how it looked before the max-width:720px cap was
  // added), so this needs to comfortably cover a full-width, ~2x/retina
  // display on a wide desktop resource panel rather than just a
  // 720px-capped one.
  var RENDER_WIDTH_PX = 2200;

  function renderPage(pageNum, canvas) {
    pdfDoc.getPage(pageNum).then(function (page) {
      var unscaled = page.getViewport({ scale: 1 });
      var scale = RENDER_WIDTH_PX / unscaled.width;
      var viewport = page.getViewport({ scale: scale });
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      var ctx = canvas.getContext('2d');
      page.render({ canvasContext: ctx, viewport: viewport });
    }).catch(function () {
      // One bad page shouldn't take down the whole document view.
    });
  }

  // Sept 2026 fix: disableRange/disableStream force PDF.js to fetch the
  // whole file with one plain GET, the same way the "Open the PDF
  // directly" fallback link (a normal browser navigation) already does -
  // see the file-header note above for why a document that opens fine
  // via that link but fails here is consistent with the server handling
  // PDF.js's default byte-range probing inconsistently for that file.
  pdfjsLib.getDocument({
    url: fileUrl,
    disableRange: true,
    disableStream: true
  }).promise.then(function (doc) {
    pdfDoc = doc;
    statusEl.style.display = 'none';
    for (var i = 1; i <= doc.numPages; i++) {
      var canvas = document.createElement('canvas');
      pagesEl.appendChild(canvas);
      renderPage(i, canvas);
    }
  }).catch(function (err) {
    // Sept 2026 fix: log the real reason instead of discarding it, so a
    // future load failure is debuggable from the browser console (the
    // fallback message shown to the student stays generic on purpose).
    try { console.error('[Stratum PDF Viewer] Failed to load PDF:', fileUrl, err); } catch (e) {}
    showFallback('This document could not be displayed here.');
  });
})();
</script>
</body>
</html>
